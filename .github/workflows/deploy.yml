name: Godot Build e Release

on:
  # O workflow será acionado quando você criar uma nova tag (ex: v1.0)
  push:
    tags:
      - 'v*' # Aciona para qualquer tag que comece com 'v' (ex: v1.0, v1.0.1)
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # Permissões necessárias para criar o Release
    permissions:
      contents: write # Permite criar e fazer upload para o Release

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          lfs: true # Necessário se você usa Git LFS

      # 1. Exportar o Projeto Godot para Windows e Linux
      # Usaremos a mesma ação, mas com diferentes presets.
      - name: Exportar para Windows e Linux
        uses: firebelley/godot-export@v5
        with:
          godot_version: 4.2.1 # Altere para sua versão do Godot
          # Presets de exportação que você configurou no Godot
          export_presets: "Windows Desktop, Linux/X11" 
          # Caminho para onde os arquivos exportados serão salvos
          export_path: "build/{{.OS}}/{{.GameName}}.{{.Extension}}" 
          project_path: "."

      # 2. Criar o Release no GitHub
      - name: Criar GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      # 3. Upload do Binário do Windows
      - name: Upload Binário Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
          asset_path: ./build/Windows/purgatory-of-alighieri.exe # Ajuste o nome do seu jogo
          asset_name: purgatory-of-alighieri-Windows.exe # Nome do arquivo para download
          asset_content_type: application/vnd.microsoft.portable-executable

      # 4. Upload do Binário do Linux
      - name: Upload Binário Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}
          asset_path: ./build/Linux/purgatory-of-alighieri.x86_64 # Ajuste o nome do seu jogo
          asset_name: purgatory-of-alighieri-Linux.x86_64 # Nome do arquivo para download
          asset_content_type: application/octet-stream

### O que você precisa fazer:

1.  **Configure os Presets de Exportação no Godot:** Certifique-se de que você tem os presets de exportação **Windows Desktop** e **Linux/X11** configurados corretamente no seu projeto Godot.
2.  **Crie o Arquivo:** Salve o código acima no seu repositório em `.github/workflows/build_and_release.yml`.
3.  **Ajuste os Nomes:** No passo de *Upload*, ajuste `purgatory-of-alighieri` para o nome real do seu jogo.
4.  **Para Acionar o Workflow:**
    *   Você precisa criar uma **tag** no seu repositório e enviá-la para o GitHub.
    *   Exemplo no seu terminal:
        ```bash
        git tag v1.0
        git push origin v1.0
        ```
    *   Isso acionará o GitHub Actions, que irá compilar o jogo e criar uma nova *Release* na aba **Releases** do seu repositório, com os arquivos `.exe` e `.x86_64` anexados.

Este é o fluxo de deploy automático mais robusto para jogos Godot que não são web, usando apenas o GitHub! Se precisar de ajuda com Android ou iOS, o processo é um pouco mais complexo (especialmente iOS), mas também é possível.
